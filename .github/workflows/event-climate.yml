# 🎪 場次氣候：每天檢查一次，場次結束滿 2 天就抓氣象署測站觀測，存到 event_climate/（commit 回 repo）
# 場次清單即時讀取使用者的 Google 試算表（CSV 匯出），新場次會自動加入；近期展望的 C3S 部分使用 GitHub Secrets 的 CDS_API_KEY
# 網站（GitHub Pages）由 tw-weather.yml 下次執行時把 event_climate/ 一起發布；jsDelivr 也能直接讀 repo
name: event-climate
on:
  schedule:
    - cron: '35 18 * * *'   # 每天台灣時間 02:35
  workflow_dispatch:
concurrency:
  group: event-climate
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 更新場次氣候資料
        run: python scripts/event_climate.py --out event_climate
      - name: 綜觀天氣圖（ERA5 再分析；只畫新的場次日）
        run: |
          pip install -q xarray zarr gcsfs matplotlib cartopy pillow
          # 偶爾連線卡住：每輪最多 8 分鐘，已完成的會保留，下一輪接著畫
          for i in 1 2 3 4 5 6; do
            timeout 480 python scripts/event_synoptic.py --out event_climate --workers 4 | tee run.log || true
            grep -q "synoptic to do 0" run.log && break
          done
          rm -f run.log
      - name: 颱風標記與警示燈號回推（中央氣象署颱風資料庫）
        run: python scripts/event_hazard.py --out event_climate
      - name: 氣候診斷（與 1991–2020 氣候值比較）
        run: python scripts/event_climo.py --out event_climate
      - name: 近期場次氣候展望（氣象署長期展望＋Copernicus C3S 季節預報）
        # 氣象署月展望每週五、季展望每月底更新：每天抓一次最新 PDF（檔案很小）
        # C3S 每月 10 日後才有新的初始場：只有新初始場時才下載；回報期門檻存在 outlook_src/，不會重抓
        # 金鑰放在 GitHub Secrets 的 CDS_API_KEY，不會寫進任何檔案；沒設定時只更新氣象署部分
        continue-on-error: true
        timeout-minutes: 45
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          sudo apt-get install -y -q poppler-utils > /dev/null
          pip install -q cdsapi netCDF4 numpy
          python scripts/event_outlook.py --out event_climate
      - name: 更新氣候指數（ENSO／PDO／MJO／IOD）
        # 每天抓 ONI、PDO、MJO 指數與 CPC／IRI 預報；示意圖只在 ERSST 有新月份時才重畫。失敗不影響其他步驟
        continue-on-error: true
        timeout-minutes: 15
        run: |
          pip install -q matplotlib netCDF4 numpy
          python scripts/event_indices.py --out event_climate
      - name: 有變更才 commit
        run: |
          git config user.name "event-climate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add event_climate
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git commit -m "場次氣候資料更新 $(date -u +%F)"
          git push
